---
layout: default
---

<article class="post container" itemscope itemtype="http://schema.org/BlogPosting">
  <header class="post-header">
    <p class="post-meta"><time datetime="{{ page.date | date_to_xmlschema }}" itemprop="datePublished">{{ page.date | date: "%b %-d, %Y" }}</time>{% if page.author %} • <span itemprop="author" itemscope itemtype="http://schema.org/Person"><span itemprop="name">{{ page.author }}</span></span>{% endif %}</p>
    <h1 class="post-title" itemprop="name headline">{{ page.title }}</h1>
  </header>
  <div class="post-content" itemprop="articleBody">
    {{ content }}
    {% include post-share.html %}
  </div>
</article>

{% include comments.html %}

<script>
/* Click any image in the post to open the full-size original in a new tab. */
(function() {
  document.querySelectorAll('.post-content img').forEach(function(img) {
    if (img.closest('a')) return; /* already a link, leave it alone */
    var src = img.currentSrc || img.src;
    if (!src) return;
    var a = document.createElement('a');
    a.href = src;
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    a.className = 'img-zoom';
    a.title = 'Open full size in a new tab';
    img.parentNode.insertBefore(a, img);
    a.appendChild(img);
  });

  /* A paragraph that holds only images (2 or more) becomes a row: images sit
     side by side and wrap to the next line only when the column runs out. */
  document.querySelectorAll('.post-content p').forEach(function(p) {
    var zooms = p.querySelectorAll(':scope > a.img-zoom');
    if (zooms.length < 2) return;
    var onlyImages = Array.prototype.every.call(p.childNodes, function(n) {
      if (n.nodeType === 3) return n.textContent.trim() === '';
      return n.nodeType === 1 && (n.matches('a.img-zoom') || n.tagName === 'BR');
    });
    if (onlyImages) p.classList.add('img-row');
  });
})();
</script>

<script>
(function() {
  var tweetPattern = /^https?:\/\/(twitter\.com|x\.com)\/[^\/]+\/status\/\d+\/?$/;
  var hasTweet = false;

  function makeEmbed(url, el) {
    var blockquote = document.createElement('blockquote');
    blockquote.className = 'twitter-tweet';
    blockquote.setAttribute('data-dnt', 'true');
    /* Show only the post that was linked: for a reply, hide the parent
       tweet above it. Use X's max width (550) so it fills the column
       without towering; the widget shrinks to fit narrow screens. */
    blockquote.setAttribute('data-conversation', 'none');
    blockquote.setAttribute('data-width', '550');
    blockquote.setAttribute('data-align', 'center');
    var a = document.createElement('a');
    a.href = url;
    blockquote.appendChild(a);
    el.replaceWith(blockquote);
    hasTweet = true;
  }

  document.querySelectorAll('.post-content a').forEach(function(a) {
    var href = a.getAttribute('href');
    if (!href || !tweetPattern.test(href.trim())) return;
    var p = a.parentElement;
    if (p.tagName !== 'P' || p.childNodes.length !== 1) return;
    makeEmbed(href.trim(), p);
  });

  document.querySelectorAll('.post-content p').forEach(function(p) {
    var text = p.textContent.trim();
    if (!tweetPattern.test(text)) return;
    makeEmbed(text, p);
  });

  if (!hasTweet) return;

  window.twttr = (function(d, s, id) {
    var js, fjs = d.getElementsByTagName(s)[0], t = window.twttr || {};
    if (d.getElementById(id)) return t;
    js = d.createElement(s);
    js.id = id;
    js.src = 'https://platform.twitter.com/widgets.js';
    fjs.parentNode.insertBefore(js, fjs);
    t._e = [];
    t.ready = function(f) { t._e.push(f); };
    return t;
  }(document, 'script', 'twitter-wjs'));

  window.twttr.ready(function(twttr) {
    twttr.widgets.load();
  });
})();
</script>

<script>
(function() {
  /* A bare YouTube URL (cut and pasted on its own line, or a link that is
     alone in its paragraph) becomes a playable embed. Understands
     watch?v=, youtu.be, shorts/, live/, embed/ and the ?t= / &t= timestamp
     (works with both 116 and 1m56s). */
  var ytPattern = /^(?:https?:\/\/)?(?:www\.|m\.|music\.)?(?:youtube\.com\/(?:watch\?(?:.*&)?v=|shorts\/|live\/|embed\/|v\/)|youtu\.be\/)([A-Za-z0-9_-]{11})/i;

  function startSeconds(url) {
    var m = url.match(/[?&#](?:t|start)=([0-9hms]+)/i);
    if (!m) return 0;
    if (/^[0-9]+$/.test(m[1])) return parseInt(m[1], 10);
    var total = 0, part, unit;
    var re = /([0-9]+)([hms])/gi;
    while ((part = re.exec(m[1]))) {
      unit = part[2].toLowerCase();
      total += parseInt(part[1], 10) * (unit === 'h' ? 3600 : unit === 'm' ? 60 : 1);
    }
    return total;
  }

  function makeEmbed(url, el) {
    var m = url.match(ytPattern);
    if (!m) return;

    var wrap = document.createElement('div');
    wrap.className = 'yt-embed';

    var frame = document.createElement('div');
    frame.className = 'yt-frame';

    var iframe = document.createElement('iframe');
    var start = startSeconds(url);
    iframe.src = 'https://www.youtube-nocookie.com/embed/' + m[1] + '?rel=0' +
                (start ? '&start=' + start : '');
    iframe.title = 'YouTube video player';
    iframe.setAttribute('loading', 'lazy');
    iframe.setAttribute('frameborder', '0');
    iframe.setAttribute('allowfullscreen', '');
    iframe.setAttribute('allow', 'accelerometer; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share');
    frame.appendChild(iframe);

    var source = document.createElement('a');
    source.className = 'yt-source';
    source.href = url;
    source.target = '_blank';
    source.rel = 'noopener noreferrer';
    source.textContent = 'Watch on YouTube';

    wrap.appendChild(frame);
    wrap.appendChild(source);
    el.replaceWith(wrap);
  }

  /* A link that is the only thing in its paragraph. */
  document.querySelectorAll('.post-content p > a[href]').forEach(function(a) {
    var p = a.parentElement;
    if (p.childNodes.length !== 1) return;
    if (!ytPattern.test(a.getAttribute('href').trim())) return;
    makeEmbed(a.getAttribute('href').trim(), p);
  });

  /* A plain URL on its own line: kramdown leaves it as text, so the whole
     paragraph is the URL. A URL never contains whitespace. */
  document.querySelectorAll('.post-content p').forEach(function(p) {
    var text = p.textContent.trim();
    if (!text || /\s/.test(text)) return;
    if (!ytPattern.test(text)) return;
    makeEmbed(text, p);
  });
})();
</script>
